[graphics]
width = 0
height = 0
fullscreen = false
borderless windowed = true
gfx driver = 1
screengamma = 1.0
show FPS = 0
framelimit = 0
vsync = 1
bump mapping enabled = 1
antialias = 1
HUD enabled = 1
HUD enabled legacy = 0
room lights enabled = 1
texture details = 3
particle amount = 2
fov = 59
view bob = 1.0
hud offset = 0.0
hud scale factor = 1.0

[general]
intro enabled = 1
achievement popup enabled = 1
move input cancelling = false
numeric seeds = 0
speed run mode = 0
play startup video = true
enable mods = 1
enable steam = 1
enable steam rich presence = 1
enable discord rich presence = 1
loading screen cycle per char ms = 60
keep duplicate saves = 0
hide incompatible saves = 0

[debug]
show map gen = 0
show forest gen = 0

[audio]
music volume = 0.5
sound volume = 1.0
dubbed audio = true
subtitles = 0
closed captions = 0
enable user tracks = 1
user track setting = 1
sfx release = 1

[controls]
mouse sensitivity = 0.0
invert mouse y = 0
mouse smoothing = 1.0

[binds]
Right key = 32
Left key = 30
Up key = 17
Down key = 31
Blink key = 57
Sprint key = 42
Inventory key = 15
Crouch key = 29
Save key = 63
Console key = 61

[launcher]
launcher enabled = true

[console]
enabled = 0
auto opening = 0

[vr]
; 1 = start in VR (or launch with -vr). Needs BlitzXR.dll and openxr_loader.dll next to the exe.
enabled = 0
; Blitz units per real metre. Lower = you feel bigger, higher = smaller.
world scale = 0.55
; multiplies the headset's recommended per-eye resolution (0.5 - 2.0)
resolution scale = 1.0
; d3d11 = system Direct3D 9, sent to the headset through Direct3D 11 (default)
; dxvk = DXVK (Direct3D 9 on Vulkan) from dxvk\d3d9.dll, sent through Vulkan. Same as launching with -dxvk.
renderer = d3d11
; 1 = snap turn with the right stick, 0 = smooth turn
snap turn = 1
snap angle = 30
smooth turn speed = 2.5
; 1 = crouching in real life crouches in game (the crouch button still works)
real crouch = 1
; how far your head has to drop below your standing height, in metres (standing height is taken when VR
; starts and after each recentre by the VR software, so recentre while standing)
crouch height = 0.45
; 1 = show your hands (GFX\VR\handleft.b3d / handright.b3d) on the controllers, fingers follow grip and trigger
show hands = 1
; 1 = hands ignore the game's lighting (use if they look too dark)
hand fullbright = 0
; adjustments to where the hands sit on the controllers (all 0 = the fit worked out from the models), in the left hand's terms (the right hand is mirrored automatically).
; offset in metres along the controller grip: x = sideways (out of the left palm), y = up (negative = lower), z = toward the thumb
hand offset x = 0.0
hand offset y = 0
hand offset z = 0.0
; extra tilt in degrees (+ tips the fingers down/forward)
hand tilt = 0
; extra rotation in degrees on top of the built-in fit
hand pitch = -15
hand yaw = 0
hand roll = 0
; -1 if the fingers bend backwards when you squeeze
hand curl sign = 1
; derived = fit worked out from the hand models (default), authored = use the models exactly as placed in the files
hand fit = derived
; 1 = blink and stamina meters on the back of your left hand (0 = in the floating HUD as before)
wrist hud = 1
; move the wrist meters, in metres: x = negative lifts them further off the back of the hand, y = toward the wrist, z = toward the thumb
wrist hud offset x = 0
wrist hud offset y = 0
wrist hud offset z = 0
; 1 = 8 cm wide
wrist hud size = 1.0
; capacitive touch (Quest Touch, Index): how curled the index finger / thumb are when just resting on the trigger / thumb controls (0..1).
; Lifting them off points the index finger / raises the thumb.
hand index touch curl = 0.3
hand thumb touch curl = 0.5
; 1 = grab levers and the SCP-914 key and knob with the controller grip (needs show hands = 1)
physical grab = 1
; how close your palm has to be to grab something, in metres
grab radius = 0.12
; 1 = a selected keycard or severed hand is held in your right hand: touch it to a keycard reader / hand scanner
physical keycards = 1
; 1 = turn the held item around (if the severed hand is held by its fingers)
held item flip = 0
; 1 = a selected document (papers, notes, badges) is shown on a sheet in your left hand instead of full screen
documents in hand = 1
; 1 = 29.7 cm tall (A4)
document size = 1.0
; size of the held keycard (1 = as big as the dropped one) and severed hand (1 = as long as your VR hand)
held keycard scale = 0.75
held hand scale = 1.0
; adjustments to how you hold things, on top of the built-in poses: offsets in metres, rotations in degrees.
; Offsets are along the hand: y negative = the way the fingers point, z = thumb side, x = out of the left palm / back of the right hand.
document offset x = 0
document offset y = 0
document offset z = 0
document pitch = 0
document yaw = 0
document roll = 0
held keycard offset x = 0
held keycard offset y = 0
held keycard offset z = 0
held keycard pitch = 0
held keycard yaw = 0
held keycard roll = 0
held hand offset x = 0
held hand offset y = 0
held hand offset z = 0
held hand pitch = 0
held hand yaw = 0
held hand roll = 0
